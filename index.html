<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<!-- favicon。無いと Console に 404 が出て、本当のエラーが埋もれるため -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23edc22e%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="header">
    <h1 class="title">2048</h1>

    <div class="scores">
      <div class="score-box">
        <span class="score-box__label">SCORE</span>
        <!-- ui.js が textContent を書き換える -->
        <span class="score-box__value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-box__label">BEST</span>
        <span class="score-box__value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="subhead">
    <p class="lead">同じ数字をぶつけて <strong>2048</strong> を作る。</p>
    <button type="button" id="restart" class="button">やり直す</button>
  </div>

  <div class="board-wrap">
    <!-- 盤面。中身は ui.js の render() が毎回まるごと作り直す -->
    <div id="board" class="board"></div>

    <!-- 結果画面。ui.js の showOverlay() が hidden を外す -->
    <div id="overlay" class="overlay" hidden>
      <p class="overlay__title">Game Over</p>
      <p class="overlay__score">スコア <span class="overlay__score-value">0</span></p>
      <button type="button" class="button button--primary overlay__button">もう一度</button>
    </div>
  </div>

  <p class="hint">矢印キー、またはスワイプで操作</p>

</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
